# secure-repo:managed
# Generated by secure-repo — do not hand-edit.
# Re-run `secure-repo` in the repo root to regenerate. See README.md.

name: security-ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: "Install dependencies (.)"
        working-directory: "."
        run: npm ci
      - name: "test (.)"
        working-directory: "."
        run: "npm run test"
